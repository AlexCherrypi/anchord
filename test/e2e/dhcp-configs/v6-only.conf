# Test scenario: only IPv6 connectivity (RA + SLAAC).
# anchord's external iface should pick up a SLAAC address from fd99::/64
# via the kernel's autoconf path. anchord's DHCPv6 client (dhcp-refresh
# mode) attempts a SOLICIT alongside; on a SLAAC-only network it just
# retries silently while the kernel does its thing.

interface=eth0

no-resolv
no-hosts

enable-ra
dhcp-range=fd99::,fd99::ffff,slaac,64,12h

log-dhcp
log-queries
