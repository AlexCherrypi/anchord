# Example: a Mailcow-style compose project using anchord-v2 to get a
# single external IP via DHCP, with two service-anchors (smtp + imap).
#
# v2 split: the macvlan network is created out-of-band (or by a small
# network-only compose project) and shared via `external: true`.
# anchord no longer plumbs the macvlan child itself.
#
# What you get:
#   - One IP on the VLAN (DHCP-refreshed, hostname-announced)
#   - SMTP ports (25/465/587) DNAT'd to the postfix container
#   - IMAP ports (143/993) DNAT'd to the dovecot container
#   - Real client source IPs preserved (no MASQUERADE on inbound)
#   - Internal DNS-based service discovery (mysql, redis are unreachable
#     from outside, only via the backend network)
#
# Prerequisite — the shared macvlan network (one-time, per host):
#
#   docker network create -d macvlan \
#       -o parent=eth0.42 \
#       --subnet=192.168.150.0/24 \
#       --gateway=192.168.150.1 \
#       dmz_macvlan
#
# Dual-stack works the same way — add a v6 subnet and Docker will hand
# out v6 addresses alongside v4, and anchord's nft tables route both:
#
#   docker network create -d macvlan \
#       -o parent=eth0.42 \
#       --ipv6 \
#       --subnet=192.168.150.0/24 --gateway=192.168.150.1 \
#       --subnet=2001:db8:dmz::/64 --gateway=2001:db8:dmz::1 \
#       dmz_macvlan
#
# Alternatively define it once in a "00-dmz-network" compose project
# and `external: true` reference it from every consumer stack.

name: mailcow-example

networks:
  dmz:
    # Pre-existing macvlan network — Docker plumbs the host-side VLAN
    # sub-interface and assigns MAC+IP. anchord just attaches.
    external: true
    name: dmz_macvlan
  transit:
    # Anchor-to-service-anchors bridge. internal:true → no implicit
    # gateway, no Docker-managed NAT (anchord owns MASQUERADE).
    driver: bridge
    internal: true
  backend:
    # Application <-> DB/cache. Service-anchors don't need to be in here
    # unless they themselves need DB access; in this example dovecot does.
    driver: bridge
    internal: true

services:

  # ---------- the network anchor itself ------------------------------------
  anchord:
    image: ghcr.io/alexcherrypi/anchord:latest   # (build locally for now)
    cap_add:
      - NET_ADMIN
    mac_address: "02:4c:4b:50:0a:01"   # stable across recreates → stable DHCP
    # anchord still routes packets between the dmz macvlan and the
    # project-internal transit bridge, so forwarding sysctls must be
    # set in its netns. v2 no longer needs the v1 ARP gymnastics
    # (arp_ignore/arp_announce); Docker handles MAC plumbing.
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.forwarding: "1"
      # accept_ra=2 keeps kernel SLAAC working when forwarding is on.
      net.ipv6.conf.all.accept_ra: "2"
      net.ipv6.conf.default.accept_ra: "2"
    networks:
      dmz:
        # Compose-assigned bootstrap IPs. anchord uses them immediately
        # and (in dhcp-refresh mode) replaces the v4 once a lease arrives;
        # v6 stays kernel-managed unless the LAN runs a DHCPv6 server,
        # in which case anchord picks up the lease alongside v4.
        ipv4_address: 192.168.150.100
        # ipv6_address: 2001:db8:dmz::100   # uncomment for v6 IPAM
      transit: {}
    environment:
      ANCHORD_PROJECT: ${COMPOSE_PROJECT_NAME}
      ANCHORD_EXT_IFACE: eth0           # the in-container iface name on the dmz network
      ANCHORD_ADDRESS_MODE: dhcp-refresh   # bootstrap | dhcp-refresh | slaac-ra-only
      ANCHORD_DHCP_HOSTNAME: mailcow       # appears in DHCP/DNS
      ANCHORD_LOG_LEVEL: info
      DOCKER_HOST: tcp://docker-proxy:2375
    depends_on:
      - docker-proxy
    restart: unless-stopped

  docker-proxy:
    # Read-only docker socket exposure. anchord only needs containers + events.
    image: tecnativa/docker-socket-proxy:latest
    environment:
      CONTAINERS: 1
      EVENTS: 1
      INFO: 1
      NETWORKS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - transit
    restart: unless-stopped

  # ---------- service anchor: SMTP -----------------------------------------
  smtp-anchor:
    image: ghcr.io/alexcherrypi/anchord:latest
    cap_add:
      - NET_ADMIN
    environment:
      ANCHORD_MODE: service-anchor
    networks:
      - transit
      - backend
    labels:
      anchord.expose: "tcp/25,tcp/465,tcp/587"
    restart: unless-stopped

  postfix:
    image: catatnight/postfix   # or mailcow's actual postfix image
    network_mode: "service:smtp-anchor"
    networks: []                # inherits from smtp-anchor — must be empty here
    depends_on:
      - smtp-anchor
    restart: unless-stopped

  # ---------- service anchor: IMAP -----------------------------------------
  imap-anchor:
    image: ghcr.io/alexcherrypi/anchord:latest
    cap_add:
      - NET_ADMIN
    environment:
      ANCHORD_MODE: service-anchor
    networks:
      - transit
      - backend
    labels:
      anchord.expose: "tcp/143,tcp/993"
    restart: unless-stopped

  dovecot:
    image: dovecot/dovecot
    network_mode: "service:imap-anchor"
    depends_on:
      - imap-anchor
    restart: unless-stopped

  # ---------- backend services (no external exposure) ----------------------
  mysql:
    image: mariadb:11
    networks: [backend]
    environment:
      MARIADB_ROOT_PASSWORD: example
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks: [backend]
    restart: unless-stopped
